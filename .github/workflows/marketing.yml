name: Marketing automation

# Every 3 hours: sync the site with new releases, take the daily metrics
# snapshot, look for new discussions, publish the weekly KEV digest and
# report, push the next dev.to article — whatever is due (marketing/run.py) —
# then deploy changed pages and send queued social posts (marketing/post.py).
# Setup and the list of secrets: marketing/README.md.

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      tasks:
        description: "Tasks to force, space-separated: release metrics mentions devto kev report (empty = whatever is due)"
        required: false
        default: ""
      force_post:
        description: "Post now, ignoring the posting window"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: marketing
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      site_changed: ${{ steps.run.outputs.site_changed }}
    steps:
      - uses: actions/checkout@v4
      - name: Run due tasks
        id: run
        continue-on-error: true  # commit what succeeded; the last step reports failures
        working-directory: marketing
        env:
          TASKS: ${{ inputs.tasks }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: python3 run.py $TASKS
      - name: Commit generated pages and data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -q -m "marketing: scheduled update [skip ci]"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
          exit 1
      - name: Report failed tasks
        if: steps.run.outcome == 'failure'
        run: |
          echo "::error::Some marketing tasks failed — see the 'Run due tasks' log."
          exit 1

  deploy:
    needs: update
    if: always() && needs.update.outputs.site_changed == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit

  announce:
    needs: [update, deploy]
    # Runs after a successful deploy, or when there was nothing to deploy.
    if: always() && needs.update.result != 'cancelled' && needs.deploy.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Send queued posts
        working-directory: marketing
        env:
          FORCE_POST: ${{ inputs.force_post && '1' || '' }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
          LINKEDIN_AUTHOR: ${{ secrets.LINKEDIN_AUTHOR }}
        run: python3 post.py
      - name: Commit post status
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A marketing/data
          git diff --cached --quiet && exit 0
          git commit -q -m "marketing: post status [skip ci]"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
          exit 1
